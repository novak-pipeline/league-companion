name: Release

# Tagging is the release trigger:
#   npm version minor && git push --follow-tags
on:
  push:
    tags: ['v*']
  # Manual dispatch builds whatever ref you run it from. `tag` is optional: with
  # it empty, electron-builder creates the release for the version in
  # package.json (tag `v${version}`) and tags the commit it built. That is the
  # path to use when you cannot push a tag directly.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (leave empty to release package.json version from this ref)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build and publish (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Never abandon a platform's installer because another platform failed —
      # a partial release is more useful than none, and the missing one can be
      # re-run on its own.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          # electron-builder needs the full history to tag the release commit.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The release must not ship code that does not pass its own checks.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Generate icon
        run: npm run make:icon

      - name: Build
        run: npm run build

      - name: Smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" node_modules/.bin/electron scripts/smoke.mjs --no-sandbox --disable-gpu

      - name: Publish installers
        # electron-builder uploads to the GitHub Release for this version,
        # creating it if it does not exist yet.
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish the release
    # Only once every platform has finished uploading, so nobody downloads a
    # release that is missing their installer.
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "value=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # electron-builder only honours `releaseType` when it *creates* the
      # release. If a draft already exists from an earlier run it uploads into
      # it and leaves it drafted — invisible to everyone but the repo owner,
      # with its git tag still uncreated. Flip it explicitly.
      - name: Mark the release published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::No release found for $TAG"
            exit 1
          fi
          gh release edit "$TAG" --draft=false --latest
          echo "Published $TAG:"
          gh release view "$TAG" --json tagName,isDraft,assets \
            --jq '"\(.tagName) draft=\(.isDraft) assets=\([.assets[].name] | join(", "))"'
